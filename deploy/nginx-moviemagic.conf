# Movie Magic — Nginx Reverse Proxy Configuration
# Place in: /etc/nginx/conf.d/moviemagic.conf

upstream moviemagic_upstream {
    server 127.0.0.1:5000 fail_timeout=0;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    client_max_body_size 5M;
    keepalive_timeout 65;

    # Static assets served directly by Nginx for speed
    location /static/ {
        alias /home/ec2-user/movie-magic/app/static/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # Health check endpoint probe
    location /health {
        proxy_pass http://moviemagic_upstream/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Pass all application requests to Gunicorn
    location / {
        proxy_pass http://moviemagic_upstream;
        proxy_redirect off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
    }
}
