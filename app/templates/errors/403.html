{% extends "base.html" %}

{% block title %}403 Forbidden — Movie Magic{% endblock %}

{% block content %}
<div class="container text-center py-5 my-5">
  <div class="card-cinematic p-5 mx-auto" style="max-width: 520px;">
    <div class="mb-3 text-warning">
      <i class="bi bi-shield-lock-fill" style="font-size: 4rem;"></i>
    </div>
    <h2 class="fw-bold text-white mb-2">403 — Access Forbidden</h2>
    <p class="text-muted mb-4">
      You do not have administrative privileges to access this area of Movie Magic.
    </p>
    <div class="d-flex justify-content-center gap-3">
      <a href="{{ url_for('main.index') }}" class="btn btn-cinematic">
        <i class="bi bi-house-door me-1"></i> Return Home
      </a>
      <a href="{{ url_for('auth.login') }}" class="btn btn-outline-cinematic">
        <i class="bi bi-person-fill me-1"></i> Switch Account
      </a>
    </div>
  </div>
</div>
{% endblock %}
